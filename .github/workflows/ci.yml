name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
      - name: Generated sqlc code is up to date
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"
      - run: sqlc diff

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.23"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assetflow
          POSTGRES_PASSWORD: assetflow
          POSTGRES_DB: assetflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assetflow -d assetflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://assetflow:assetflow@localhost:5432/assetflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Migrate
        run: |
          docker run --rm --network host -v "$PWD/db/migrations:/migrations" migrate/migrate:v4.17.1 \
            -path=/migrations -database="$TEST_DATABASE_URL" up
      - name: Test (race detector, unit + integration)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cmd: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: CMD=${{ matrix.cmd }}
          tags: assetflow-${{ matrix.cmd }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.cmd }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cmd }}
      - name: Image size
        run: docker image ls assetflow-${{ matrix.cmd }}:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
