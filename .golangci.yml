run:
  timeout: 5m

linters:
  enable:
    # defaults: errcheck, gosimple, govet, ineffassign, staticcheck, unused
    - bodyclose    # HTTP response bodies are closed
    - errorlint    # errors compared with errors.Is/As, wrapped with %w
    - gofmt
    - goimports
    - gosec        # common security mistakes
    - misspell
    - nolintlint   # every //nolint is used and explained
    - revive
    - unconvert

linters-settings:
  goimports:
    local-prefixes: github.com/jenish0908/assetflow
  nolintlint:
    require-explanation: true
    require-specific: true
  revive:
    rules:
      - name: exported
        disabled: true # package docs are enough for an application
  gosec:
    excludes:
      - G115 # int conversions are bounded by validation before they happen

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec]
